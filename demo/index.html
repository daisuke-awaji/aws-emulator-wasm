<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A Todo app with no server. MSW hands requests to a Hono API that calls DynamoDB, S3 and SQS on the AWS Emulator (wasm) running in the browser." />
    <!-- Keep the emulator's state across reloads (OPFS), under this name. The suffix changes
         with the table's key schema, so a snapshot of the old schema is never restored. -->
    <meta name="aws-emulator-persist" content="todo-demo-2" />
    <title>Todo — AWS Emulator in the browser</title>
    <!-- Link previews (og.png: docs/img/ogp/ogp-a-light.png, from scripts/ogp.mjs). Absolute
         URLs, as crawlers require: the GitHub Pages site. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="aws-emulator-wasm" />
    <meta property="og:title" content="AWS in a browser tab — aws-emulator-wasm" />
    <meta property="og:description" content="DynamoDB, S3 and SQS on WebAssembly, behind the real AWS SDK v3. No server, no Docker, no AWS account." />
    <meta property="og:url" content="https://daisuke-awaji.github.io/aws-emulator-wasm/" />
    <meta property="og:image" content="https://daisuke-awaji.github.io/aws-emulator-wasm/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AWS in a browser tab: React, MSW, Hono and WebAssembly in front of DynamoDB, S3 and SQS. A hobby project, not affiliated with AWS." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
