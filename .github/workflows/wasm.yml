name: wasm

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.100.0"
  WASI_SDK_VERSION: "34"
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "s"
  CARGO_PROFILE_RELEASE_DEBUG: "false"
  # Service constructors use large stack frames; the default 1 MiB wasm stack is too small.
  CARGO_TARGET_WASM32_WASIP1_RUSTFLAGS: "-C link-arg=-zstack-size=8388608"
  WASM: target/wasm32-wasip1/release/aws_emulator_wasm_host.wasm

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-wasip1
          rustup default "$RUST_VERSION"
          rustc --version

      - name: Install wasi-sdk
        run: |
          curl -sSfL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          W="$RUNNER_TEMP/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux"
          {
            echo "CC_wasm32_wasip1=$W/bin/clang"
            echo "AR_wasm32_wasip1=$W/bin/llvm-ar"
            echo "CFLAGS_wasm32_wasip1=--sysroot=$W/share/wasi-sysroot"
          } >> "$GITHUB_ENV"

      - name: Fetch upstream and apply the wasm patch set
        run: bash scripts/fetch-upstream.sh "$GITHUB_WORKSPACE/.upstream"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: wasm-${{ env.RUST_VERSION }}-${{ hashFiles('scripts/**', 'patches/**', 'crates/**') }}
          restore-keys: wasm-${{ env.RUST_VERSION }}-

      - name: Build the wasm emulator
        working-directory: .upstream
        run: |
          start=$(date +%s)
          cargo build --release --target wasm32-wasip1 -p aws-emulator-wasm-host
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          ls -l "$GITHUB_WORKSPACE/$WASM"
          df -h /

      - name: Optimize with wasm-opt
        id: opt
        continue-on-error: true
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R WebAssembly/binaryen --pattern 'binaryen-*-x86_64-linux.tar.gz' -O - | tar xz -C "$RUNNER_TEMP"
          OPT=$(ls -d "$RUNNER_TEMP"/binaryen-*/bin)/wasm-opt
          "$OPT" --version
          "$OPT" -Oz "$WASM" -o target/aws-emulator.opt.wasm

      - name: Measure sizes
        run: |
          sudo apt-get install -y -qq brotli > /dev/null
          row() {
            [ -f "$1" ] || return 0
            raw=$(stat -c %s "$1")
            gz=$(gzip -9 -c "$1" | wc -c)
            br=$(brotli -q 11 -c "$1" | wc -c)
            printf '| %s | %.1f MB | %.1f MB | %.1f MB |\n' "$2" "$(echo "$raw/1048576" | bc -l)" "$(echo "$gz/1048576" | bc -l)" "$(echo "$br/1048576" | bc -l)"
          }
          {
            echo "## wasm build"
            echo
            echo "- rustc $RUST_VERSION, wasi-sdk $WASI_SDK_VERSION, opt-level=$CARGO_PROFILE_RELEASE_OPT_LEVEL"
            echo "- build time: ${BUILD_SECONDS}s"
            echo "- wasm-opt: ${{ steps.opt.outcome }}"
            echo
            echo "| file | raw | gzip -9 | brotli -q 11 |"
            echo "|---|---|---|---|"
            row "$WASM" "cargo build --release"
            row target/aws-emulator.opt.wasm "wasm-opt -Oz"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: JS tests against the cargo build
        env:
          EMULATOR_WASM: ${{ github.workspace }}/${{ env.WASM }}
        run: |
          npm test -w js 2>&1 | tee "$RUNNER_TEMP/test-raw.log"
          {
            echo
            echo "### Node (cargo build)"
            echo '```'
            grep -E '^# ' "$RUNNER_TEMP/test-raw.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: JS tests against the wasm-opt build
        if: steps.opt.outcome == 'success'
        env:
          EMULATOR_WASM: ${{ github.workspace }}/target/aws-emulator.opt.wasm
        run: npm test -w js

      - uses: actions/upload-artifact@v4
        with:
          name: aws-emulator-wasm
          path: |
            ${{ env.WASM }}
            target/aws-emulator.opt.wasm
          if-no-files-found: error
          retention-days: 14

  browser:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      # The site is built and tested as GitHub Pages serves it: under /<repository>/.
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: aws-emulator-wasm
          path: ${{ runner.temp }}/wasm

      - name: Install JS dependencies and Chromium
        run: |
          npm ci --no-audit --no-fund
          npx -w demo playwright install --with-deps chromium

      - name: Build the demo site
        run: |
          W="$RUNNER_TEMP/wasm"
          if [ -f "$W/aws-emulator.opt.wasm" ]; then src="$W/aws-emulator.opt.wasm"; else src=$(find "$W" -name aws_emulator_wasm_host.wasm); fi
          EMULATOR_WASM="$src" npm run wasm -w demo
          npm run build -w demo
          ls -l demo/dist demo/dist/assets

      - name: Playwright (Chromium, desktop and mobile)
        env:
          CI: "true"
        run: |
          npm run test:e2e -w demo 2>&1 | tee "$RUNNER_TEMP/e2e.log"
          {
            echo "## Browser (Chromium)"
            echo
            echo '```'
            grep -E 'passed|failed|flaky|skipped|^\[(desktop|mobile)\]$|^(ready|dynamodb|s3|sqs) ' "$RUNNER_TEMP/e2e.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            demo/playwright-report
            demo/test-results
          retention-days: 7

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: demo/dist

  deploy:
    needs: browser
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
